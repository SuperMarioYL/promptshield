<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" data-palette="5689e6-816ae7-ace1f6-470d87c77d04" role="img" aria-labelledby="architecture-light-title architecture-light-desc"><title id="architecture-light-title">PromptShield architecture</title><desc id="architecture-light-desc">Collect text, match rules, apply reviewed exceptions</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x2="1000" y2="570"><stop stop-color="#4770bd"/><stop offset=".6" stop-color="#7460d1"/><stop offset="1" stop-color="#5a7680"/></linearGradient><radialGradient id="halo"><stop stop-color="#4770bd" stop-opacity=".22"/><stop offset="1" stop-color="#f9fbfe" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#cbdbf7" stroke-opacity=".35" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#4770bd" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans",sans-serif}.flow{stroke-dasharray:10 110;animation:flow 6s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.turn{transform-box:fill-box;transform-origin:center;animation:turn 36s linear infinite}@keyframes flow{to{stroke-dashoffset:-360}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}.flow{display:none}}</style><rect width="1000" height="570" rx="16" fill="#f9fbfe"/><rect width="1000" height="570" rx="16" fill="url(#grid)"/><ellipse cx="630.0" cy="245.1" rx="500.0" ry="399.0" fill="url(#halo)"/><text x="44" y="44" fill="#556888" font-size="13" text-anchor="start" font-weight="400">ARCHITECTURE / DATA FLOW</text><text x="44" y="84.0" fill="#131d30" font-size="30" text-anchor="start" font-weight="400">Collect text, match rules, apply reviewed exceptions</text><path d="M320 203H360" fill="none" stroke="#4770bd" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M320 203H360" class="flow" fill="none" stroke="#5a7680" stroke-width="2"/><path d="M636 203H676" fill="none" stroke="#4770bd" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M636 203H676" class="flow" fill="none" stroke="#5a7680" stroke-width="2"/><path d="M814.0 264V334.0H182.0V372" fill="none" stroke="#4770bd" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M814.0 264V334.0H182.0V372" class="flow" fill="none" stroke="#5a7680" stroke-width="2"/><rect x="44" y="142" width="276" height="122" rx="12" fill="#f7f9fe" stroke="#cbdbf7"/><text x="62" y="173.0" fill="#131d30" font-size="21" text-anchor="start" font-weight="400">Collectors</text><text x="62" y="225.0" fill="#556888" font-size="17" text-anchor="start" font-weight="400">paths / diffs / PR JSON</text><rect x="360" y="142" width="276" height="122" rx="12" fill="#f7f9fe" stroke="#cbdbf7"/><text x="378" y="173.0" fill="#131d30" font-size="21" text-anchor="start" font-weight="400">Decode + rules</text><text x="378" y="225.0" fill="#556888" font-size="17" text-anchor="start" font-weight="400">text variants and</text><text x="378" y="248.8" fill="#556888" font-size="17" text-anchor="start" font-weight="400">patterns</text><rect x="676" y="142" width="276" height="122" rx="12" fill="#f7f9fe" stroke="#cbdbf7"/><text x="694" y="173.0" fill="#131d30" font-size="21" text-anchor="start" font-weight="400">Baseline</text><text x="694" y="225.0" fill="#556888" font-size="17" text-anchor="start" font-weight="400">accepted finding</text><text x="694" y="248.8" fill="#556888" font-size="17" text-anchor="start" font-weight="400">fingerprints</text><rect x="44" y="372" width="276" height="122" rx="12" fill="#f7f9fe" stroke="#cbdbf7"/><text x="62" y="403.0" fill="#131d30" font-size="21" text-anchor="start" font-weight="400">ScanResult</text><text x="62" y="455.0" fill="#556888" font-size="17" text-anchor="start" font-weight="400">evidence, counts and</text><text x="62" y="478.8" fill="#556888" font-size="17" text-anchor="start" font-weight="400">exit code</text></svg>
